<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 270px;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #111827;
      background: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 17px;
      font-weight: 800;
      color: #2563eb;
      letter-spacing: -0.5px;
    }
    .badge {
      font-size: 10px;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: 600;
    }
    .status-box {
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .status-box.ok {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }
    .status-box.warn {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }
    .status-box.loading {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      color: #6b7280;
    }
    .uid {
      font-size: 11px;
      color: #6b7280;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hint {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    .btn {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-ghost {
      background: #f3f4f6;
      color: #374151;
    }
    .btn-ghost:hover { background: #e5e7eb; }
    hr { border: none; border-top: 1px solid #f3f4f6; margin: 12px 0; }
    .version { font-size: 10px; color: #d1d5db; text-align: right; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">쏙튜브</span>
    <span class="badge">확장</span>
  </div>

  <div id="status-box" class="status-box loading">확인 중...</div>
  <p id="hint" class="hint"></p>

  <div class="btn-row">
    <a href="https://www.ssoktube.com" target="_blank" class="btn btn-primary">쏙튜브 열기</a>
    <button id="logout-btn" class="btn btn-ghost" style="display:none">로그아웃</button>
  </div>

  <hr />
  <div class="version">v1.0.0</div>

  <script src="popup.js"></script>
</body>
</html>
